apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticket-triage-model
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/awitlib/ticket-triage-pipeline.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: model-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
